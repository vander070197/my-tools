<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Formatter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #preview {
      border: 1px solid #ced4da;
      padding: 15px;
      min-height: 150px;
      background-color: #f8f9fa;
      font-size: 14px;
      white-space: pre-wrap;
      font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
      color: #333;
      background-color: transparent;
    }

    #preview a {
      text-decoration: none;
      color: #3c8dbc;
    }
  </style>
</head>
<body class="p-4">

<div class="container">
  <h4 class="mb-3">Formatted Text with Link & Email Detection</h4>

  <div class="mb-3">
    <label for="inputText" class="form-label">Enter Text</label>
    <textarea id="inputText" class="form-control" rows="6" placeholder="Paste or type your content here..."></textarea>
  </div>

  <div class="mb-3">
    <button class="btn btn-secondary me-2" id="previewBtn">Preview</button>
    <button class="btn btn-primary" id="copyBtn">Copy Preview</button>
  </div>

  <h5>Preview</h5>
  <div id="preview" contenteditable="true"></div>
</div>

<script>
  const textarea = document.getElementById('inputText');
  const preview = document.getElementById('preview');
  const copyBtn = document.getElementById('copyBtn');
  const previewBtn = document.getElementById('previewBtn');

  function updatePreview() {
    let text = textarea.value;

    // Escape HTML
    text = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // Bold keywords
    const keywords = ["Post-Deployment QA:", "All Pages:", "Forms:", "N/A"];
    keywords.forEach(keyword => {
      const regex = new RegExp(keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), "g");
      text = text.replace(regex, `<strong>${keyword}</strong>`);
    });

    // Detect and bold email addresses (not clickable)
    const emailRegex = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/g;
    text = text.replace(emailRegex, match => `<strong>${match}</strong>`);

    // Convert URLs (not emails) to clickable links
    const urlRegex = /(?<!@)(https?:\/\/[^\s<]+)/g;
    text = text.replace(urlRegex, url => `<a href="${url}" target="_blank">${url}</a>`);

    // Convert newlines to <br>
    text = text.replace(/\n/g, "<br>");

    preview.innerHTML = text;
  }

  previewBtn.addEventListener('click', updatePreview);

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const html = document.getElementById('preview').innerHTML;
      const blob = new Blob([html], { type: "text/html" });
      const data = [new ClipboardItem({ "text/html": blob })];
      try {
        await navigator.clipboard.write(data);
        alert("Formatted preview copied!");
      } catch (err) {
        alert("Failed to copy: " + err);
      }
    });
</script>

</body>
</html>
