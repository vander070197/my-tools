<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Formatter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    textarea {
      overflow: hidden;
      resize: none;
      min-height: 100px;
    }
    #outputDiv {
      font-family: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.42857143;
      color: #333;
      white-space: pre-wrap;
      padding: .375rem .75rem;
      border: 1px solid #ced4da;
      border-radius: .375rem;
      min-height: 100px;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h3 class="mb-3">Time Formatter</h3>
    
    <div class="mb-3">
      <label for="teamDropdown" class="form-label">Select Team</label>
      <select id="teamDropdown" class="form-select"></select>
    </div>

    <div class="mb-3">
      <label for="inputText" class="form-label">Input Times</label>
      <textarea class="form-control" id="inputText" placeholder="Paste your times here..."></textarea>
    </div>

    <div class="mb-3">
      <button class="btn btn-primary me-2" id="formatBtn">Format Times</button>
      <button class="btn btn-success" id="copyBtn">Copy Result</button>
    </div>

    <div class="mb-3">
      <label for="outputDiv" class="form-label">Formatted Result</label>
      <div id="outputDiv" class="form-control" contenteditable="false"></div>
    </div>
  </div>

  <script>
    const teams = [
      "Checked for other team instructions",
      "Production Rally",
      "Monday Huddle",
      "Monthly Games",
      "Monthly Awarding",
      "Quick Meeting"
    ];

    const dropdown = document.getElementById('teamDropdown');

    teams.forEach(team => {
      const option = document.createElement('option');
      option.value = team;
      option.textContent = team;
      dropdown.appendChild(option);
    });

    function autoResize(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = (textarea.scrollHeight) + "px";
    }

    document.getElementById('inputText').addEventListener('input', function () {
      autoResize(this);
    });

    // ➡ Helper to parse time and check if below 09:00 am
    function adjustTimeStart(timeStr) {
      if (!timeStr) return timeStr;

      // e.g. "08:45 am"
      const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(am|pm)/i);
      if (!match) return timeStr; // skip if not matching time format

      let hour = parseInt(match[1], 10);
      let minute = parseInt(match[2], 10);
      let period = match[3].toLowerCase();

      // Convert to 24-hour time
      if (period === 'pm' && hour !== 12) hour += 12;
      if (period === 'am' && hour === 12) hour = 0;

      const totalMinutes = hour * 60 + minute;

      // Check if before 9:00 am
      const minMinutes = 9 * 60; // 09:00 am = 540 minutes
      if (totalMinutes < minMinutes) {
        return "09:00 am";
      }

      return timeStr;
    }

    document.getElementById('formatBtn').addEventListener('click', function () {
      const teamTitle = dropdown.value || "Checked for other team instructions";
      const input = document.getElementById('inputText').value;
      const lines = input.split('\n');

      const cleanedLines = lines
        .map(line => {
          line = line.replace(/^\s*-\s*/, '');
          line = line.replace(/\s+/g, ' ');
          line = line.replace(/\s*-\s*/g, ' - ');
          return line.trim();
        })
        .filter(line => line.length > 0);

      let htmlResult = '';

      if (cleanedLines.length > 0) {
        htmlResult += `<strong>${teamTitle}</strong><br>`;
      }

      cleanedLines.forEach(line => {
        const parts = line.split(' - ');
        let timeStart = parts[0] || '';
        const timeEnd = parts[1] || '';

        // 🔥 Check if timeStart < 9:00 am and adjust
        timeStart = adjustTimeStart(timeStart);

        htmlResult += `Time Start: ${timeStart}<br>`;
        htmlResult += `Time End: ${timeEnd}<br><br>`;
      });

      document.getElementById('outputDiv').innerHTML = htmlResult.trim();
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      let html = document.getElementById('outputDiv').innerHTML;
      html = html.replace(/(<br\s*\/?>\s*)+$/i, '');

      const blob = new Blob([html], { type: "text/html" });
      const data = [new ClipboardItem({ "text/html": blob })];
      try {
        await navigator.clipboard.write(data);
        alert("Formatted preview copied!");
      } catch (err) {
        alert("Failed to copy: " + err);
      }
    });

    autoResize(document.getElementById('inputText'));
  </script>
</body>
</html>
