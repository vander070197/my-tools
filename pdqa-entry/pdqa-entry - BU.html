<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedding Another HTML Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* THEME VARIABLES */
    :root {
      --bg-color: #ffffff;
      --text-color: #212529;
      --card-bg: #f8f9fa;
      --border-color: #dee2e6;
    }
    body.dark {
      --bg-color: #121212;
      --text-color: #e9ecef;
      --card-bg: #1e1e1e;
      --border-color: #444;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: 0.3s;
    }

    iframe {
      width: 100%;
      height: 750px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
    }

    /* FULL WIDTH LAYOUT */
    .full-container {
      width: 100%;
      max-width: 100%;
      padding-left: 40px;
      padding-right: 40px;
    }

    /* Vertical Tabs */
    .vertical-tabs {
      display: flex;
      gap: 30px;
    }

    .vertical-tabs .nav {
      min-width: 260px;
      flex-direction: column;
      border-right: 2px solid var(--border-color);
      padding-right: 20px;
    }

    .vertical-tabs .nav-link {
      text-align: left;
      border-radius: 8px;
      margin-bottom: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 500;
    }

    .vertical-tabs .tab-content {
      flex-grow: 1;
    }

    /* Theme Toggle Button */
    .theme-toggle {
      position: fixed;
      right: 25px;
      top: 25px;
      z-index: 999;
    }
  </style>
</head>

<body class="py-5">

  <!-- Theme Toggle Button -->
  <button id="themeBtn" class="btn btn-dark theme-toggle">Dark Mode</button>

  <div class="full-container">

    <h1 class="mb-4">Main Page</h1>
    <p class="mb-4">This page embeds other pages below using an iframe:</p>

    <div class="vertical-tabs">

      <!-- Vertical Tabs -->
      <ul class="nav nav-pills flex-column" id="vTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="task-tab" data-bs-toggle="tab" data-bs-target="#task"
                  type="button" role="tab">Task & URL</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="backup-tab" data-bs-toggle="tab" data-bs-target="#backup"
                  type="button" role="tab">Back-up Entry</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="notes-tab" data-bs-toggle="tab" data-bs-target="#notes"
                  type="button" role="tab">Additional Note</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="other-tab" data-bs-toggle="tab" data-bs-target="#other"
                  type="button" role="tab">Other Entry</button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="vTabContent">

        <!-- TAB 1 -->
        <div class="tab-pane fade show active" id="task" role="tabpanel">
          <h3>Task & URL Entry</h3>
          <iframe src="tools/task-url-orch-entry.html"></iframe>
        </div>

        <!-- TAB 2 -->
        <div class="tab-pane fade" id="backup" role="tabpanel">
          <h3>Back-up Entry</h3>
          <iframe src="tools/back-up-orch-entry.html"></iframe>
        </div>

        <!-- TAB 3 -->
        <div class="tab-pane fade" id="notes" role="tabpanel">
          <h3>Additional Note</h3>
          <iframe src="tools/email-entry.html"></iframe>
        </div>

        <!-- TAB 4 -->
        <div class="tab-pane fade" id="other" role="tabpanel">
          <h3>Other Entry (Meetings & Team Checks)</h3>
          <iframe src="tools/meetings-other-team-check.html"></iframe>
        </div>

      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Dark Mode Toggle Script -->
  <script>
    const themeBtn = document.getElementById("themeBtn");

    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");

      if (document.body.classList.contains("dark")) {
        themeBtn.textContent = "Light Mode";
        themeBtn.classList.replace("btn-dark", "btn-light");
      } else {
        themeBtn.textContent = "Dark Mode";
        themeBtn.classList.replace("btn-light", "btn-dark");
      }
    });
  </script>

</body>
</html>
