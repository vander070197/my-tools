<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Link Converter with Formatting Copy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #333;
      line-height: 1.42857143;
    }
    #output {
      font-family: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #333;
    }
    #output a {
      color: #3c8dbc;
      text-decoration: underline;
    }
    #copyFrame {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h5 class="mb-3">Text to Link Converter</h5>
    <textarea id="textInput" class="form-control mb-3" rows="6" placeholder="Enter your plain text with URLs..."></textarea>

    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-primary" onclick="convertToLinks()">Convert to Clickable Links</button>
      <button class="btn btn-success" id="copyBtn">Copy Text with Links</button>
    </div>

    <div id="output" class="border rounded p-3"></div>
  </div>

  <iframe id="copyFrame"></iframe>

  <script>
    function escapeHTML(str) {
      return str.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function convertToLinks() {
      const input = document.getElementById('textInput').value;
      const lines = input.split('\n');
      const urlRegex = /(https?:\/\/[^\s]+)/g;

      let html = '';
      for (let line of lines) {
        line = escapeHTML(line);
        line = line.replace(urlRegex, function (url) {
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        });
        html += line + '<br>'; // preserve line breaks
      }

      document.getElementById('output').innerHTML = html;
    }

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const html = document.getElementById('output').innerHTML;
      const blob = new Blob([html], { type: "text/html" });
      const data = [new ClipboardItem({ "text/html": blob })];
      try {
        await navigator.clipboard.write(data);
        alert("Formatted content copied!");
      } catch (err) {
        alert("Failed to copy: " + err);
      }
    });
  </script>
</body>
</html>
