<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Splitter by Group Size</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    pre {
      background: #1e1e1e;
      color: #eee;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 900px;">

  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">List Splitter Tool</h5>
    </div>
    <div class="card-body">

      <!-- Textarea -->
      <label class="form-label fw-bold">Enter Listed Values (one per line):</label>
      <textarea id="listInput" class="form-control mb-3" rows="6" placeholder="Example:
Item 1
Item 2
Item 3
..."></textarea>

      <!-- Dropdown -->
      <label class="form-label fw-bold">Separate Every:</label>
      <select id="groupSize" class="form-select mb-3" style="max-width: 200px;">
        <option value="10">10 Items</option>
        <option value="20">20 Items</option>
        <option value="30">30 Items</option>
        <option value="40">40 Items</option>
        <option value="50">50 Items</option>
      </select>

      <!-- Button -->
      <button id="generateBtn" class="btn btn-success mb-4">Generate Sections</button>

      <!-- Results (Accordion) -->
      <div id="resultContainer" class="accordion"></div>

    </div>
  </div>

</div>

<script>
  const generateBtn = document.getElementById("generateBtn");
  const listInput = document.getElementById("listInput");
  const groupSize = document.getElementById("groupSize");
  const resultContainer = document.getElementById("resultContainer");

  generateBtn.addEventListener("click", () => {
    const items = listInput.value.split("\n").map(a => a.trim()).filter(a => a !== "");
    const size = parseInt(groupSize.value);

    resultContainer.innerHTML = ""; // clear previous results

    if (items.length === 0) {
      resultContainer.innerHTML = "<div class='text-danger'>Please enter some items.</div>";
      return;
    }

    // Split into groups and generate accordion items
    for (let i = 0; i < items.length; i += size) {
      const groupIndex = Math.floor(i / size) + 1;
      let section = items.slice(i, i + size).join("\n");

      const itemId = `group${groupIndex}`;

      resultContainer.innerHTML += `
        <div class="accordion-item shadow-sm mb-2">
          <h2 class="accordion-header" id="heading${itemId}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#collapse${itemId}" aria-expanded="false" aria-controls="collapse${itemId}">
              Group ${groupIndex}
            </button>
          </h2>
          <div id="collapse${itemId}" class="accordion-collapse collapse"
            aria-labelledby="heading${itemId}" data-bs-parent="#resultContainer">
            <div class="accordion-body">
              <pre class="mb-3">${section}</pre>
              <button class="btn btn-primary copy-btn" data-index="${groupIndex - 1}">Copy</button>
            </div>
          </div>
        </div>
      `;
    }

    // Add copy functionality (using index)
    document.querySelectorAll(".copy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const idx = btn.getAttribute("data-index");
        const textToCopy = document.querySelectorAll("pre")[idx].innerText;

        navigator.clipboard.writeText(textToCopy);

        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1500);
      });
    });

  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
