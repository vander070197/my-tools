<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Link Copier</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body { background: #f8f9fa; }
.link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
}
.link-text { word-break: break-all; flex: 1; }
</style>
</head>
<body>

<div class="container py-5">
    <h3 class="mb-3">Bulk Link Copy Tool</h3>

    <!-- Counters -->
    <div class="mb-3">
        <span class="badge bg-primary">Total Links: <span id="totalLinks">0</span></span>
        <span class="badge bg-success">Copied: <span id="copiedLinks">0</span></span>
    </div>

    <!-- Textarea -->
    <div class="mb-3">
        <label class="form-label">Paste your links (one per line)</label>
        <textarea id="linkInput" class="form-control" rows="6" placeholder="https://example.com"></textarea>
    </div>

    <button id="generateLinks" class="btn btn-primary mb-4">
        <i class="bi bi-list-ul me-1"></i> Generate Links
    </button>

    <!-- Generated list -->
    <div id="linkList" class="d-grid gap-2"></div>
</div>

<!-- Duplicate Modal -->
<div class="modal fade" id="duplicateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Duplicate Links Detected</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>The following link(s) are duplicated:</p>
        <ul id="duplicateList"></ul>
      </div>
      <div class="modal-footer">
        <button id="removeDuplicatesBtn" class="btn btn-warning">Remove Duplicates & Proceed</button>
      </div>
    </div>
  </div>
</div>

<script>
$(document).ready(function () {

    let copiedCount = 0;
    let uniqueLinks = [];

    $('#generateLinks').on('click', function () {
        const input = $('#linkInput').val().trim();
        $('#linkList').empty();
        copiedCount = 0;
        $('#copiedLinks').text(0);

        if (!input) {
            alert('Please paste at least one link.');
            return;
        }

        const links = input.split('\n').map(l => l.trim()).filter(l => l !== '');
        const duplicates = [];
        const seen = new Set();
        uniqueLinks = [];

        links.forEach(link => {
            if (seen.has(link)) duplicates.push(link);
            else {
                seen.add(link);
                uniqueLinks.push(link);
            }
        });

        $('#totalLinks').text(uniqueLinks.length);

        if (duplicates.length > 0) {
            $('#duplicateList').empty();
            duplicates.forEach(d => $('#duplicateList').append(`<li>${d}</li>`));
            $('#duplicateModal').modal('show');
            return; // stop here until duplicates are removed
        }

        renderLinks(uniqueLinks);
    });

    $('#removeDuplicatesBtn').on('click', function () {
        // Remove duplicates from textarea
        $('#linkInput').val(uniqueLinks.join('\n'));
        $('#duplicateModal').modal('hide');
        renderLinks(uniqueLinks);
    });

    function renderLinks(links) {
        $('#linkList').empty();
        links.forEach(link => {
            const item = `
                <div class="link-item">
                    <a href="${link}" target="_blank" class="link-text">${link}</a>
                    <button class="btn btn-outline-secondary btn-sm copy-btn" data-link="${link}">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </div>
            `;
            $('#linkList').append(item);
        });
    }

    // Copy button
    $(document).on('click', '.copy-btn', function () {
        const btn = $(this);
        const link = btn.data('link');
        navigator.clipboard.writeText(link).then(function () {
            copiedCount++;
            $('#copiedLinks').text(copiedCount);
            btn.removeClass('btn-outline-secondary').addClass('btn-success')
               .html('<i class="bi bi-check-circle"></i>').prop('disabled', true);
        });
    });

});
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
