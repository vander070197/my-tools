<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Copier</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body { background: #f8f9fa; }
.link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
}
.link-text { word-break: break-all; flex: 1; }
#linkList:empty::after {
    content: "Your links will show up here after you click Generate Links.";
    color: #9aa1ac;
    font-style: italic;
}
</style>
</head>
<body>

<div class="container py-4 py-md-5 px-3" style="max-width: 900px;">
    <h3 class="mb-3">Bulk Link Copy Tool</h3>

    <!-- Counters -->
    <div class="mb-3 d-flex flex-wrap gap-2">
        <span class="badge bg-primary">Total Links: <span id="totalLinks">0</span></span>
        <span class="badge bg-success">Copied: <span id="copiedLinks">0</span></span>
    </div>

    <!-- Textarea -->
    <div class="mb-3">
        <label class="form-label">Paste your links (one per line)</label>
        <textarea id="linkInput" class="form-control" rows="6" placeholder="https://example.com"></textarea>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
      <button id="generateLinks" class="btn btn-primary">
          <i class="bi bi-list-ul me-1"></i> Generate Links
      </button>
      <button id="resetBtn" class="btn btn-outline-danger">
          <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
      </button>
    </div>

    <!-- Generated list -->
    <div id="linkList" class="d-grid gap-2"></div>
</div>

<!-- Duplicate Modal -->
<div class="modal fade" id="duplicateModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Duplicate Links Detected</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>The following link(s) are duplicated:</p>
        <ul id="duplicateList"></ul>
      </div>
      <div class="modal-footer">
        <button id="removeDuplicatesBtn" class="btn btn-warning">Remove Duplicates & Proceed</button>
      </div>
    </div>
  </div>
</div>

<script>
$(document).ready(function () {

    const STORAGE_KEY = 'tool_bulk-link-copy-tool_data';

    let copiedCount = 0;
    let uniqueLinks = [];

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                linkInput: $('#linkInput').val(),
                uniqueLinks: uniqueLinks,
                copiedLinks: $('#linkList .copy-btn.btn-success').map(function(){
                    return $(this).data('link');
                }).get()
            }));
        } catch (e) { console.error('Could not save data:', e); }
    }

    function loadState() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }
        catch (e) { saved = null; }
        if (!saved) return;

        if (typeof saved.linkInput === 'string') $('#linkInput').val(saved.linkInput);

        if (Array.isArray(saved.uniqueLinks) && saved.uniqueLinks.length) {
            uniqueLinks = saved.uniqueLinks;
            $('#totalLinks').text(uniqueLinks.length);
            renderLinks(uniqueLinks);

            const copiedSet = new Set(saved.copiedLinks || []);
            copiedCount = 0;
            $('#linkList .copy-btn').each(function () {
                if (copiedSet.has($(this).data('link'))) {
                    copiedCount++;
                    $(this).removeClass('btn-outline-secondary').addClass('btn-success')
                        .html('<i class="bi bi-check-circle"></i>').prop('disabled', true);
                }
            });
            $('#copiedLinks').text(copiedCount);
        }
    }

    $('#linkInput').on('input', saveState);

    $('#resetBtn').on('click', function () {
        if (!confirm('Reset this tab\'s saved data? This cannot be undone.')) return;
        $('#linkInput').val('');
        $('#linkList').empty();
        $('#totalLinks').text(0);
        $('#copiedLinks').text(0);
        copiedCount = 0;
        uniqueLinks = [];
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    });

    $('#generateLinks').on('click', function () {
        const input = $('#linkInput').val().trim();
        $('#linkList').empty();
        copiedCount = 0;
        $('#copiedLinks').text(0);

        if (!input) {
            alert('Please paste at least one link.');
            return;
        }

        const links = input.split('\n').map(l => l.trim()).filter(l => l !== '');
        const duplicates = [];
        const seen = new Set();
        uniqueLinks = [];

        links.forEach(link => {
            if (seen.has(link)) duplicates.push(link);
            else {
                seen.add(link);
                uniqueLinks.push(link);
            }
        });

        $('#totalLinks').text(uniqueLinks.length);

        if (duplicates.length > 0) {
            $('#duplicateList').empty();
            duplicates.forEach(d => $('#duplicateList').append(`<li>${d}</li>`));
            $('#duplicateModal').modal('show');
            return; // stop here until duplicates are removed
        }

        renderLinks(uniqueLinks);
        saveState();
    });

    $('#removeDuplicatesBtn').on('click', function () {
        // Remove duplicates from textarea
        $('#linkInput').val(uniqueLinks.join('\n'));
        $('#duplicateModal').modal('hide');
        renderLinks(uniqueLinks);
        saveState();
    });

    function renderLinks(links) {
        $('#linkList').empty();
        links.forEach(link => {
            const item = `
                <div class="link-item">
                    <a href="${link}" target="_blank" class="link-text">${link}</a>
                    <button class="btn btn-outline-secondary btn-sm copy-btn" data-link="${link}">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </div>
            `;
            $('#linkList').append(item);
        });
    }

    // Copy button
    $(document).on('click', '.copy-btn', function () {
        const btn = $(this);
        const link = btn.data('link');
        navigator.clipboard.writeText(link).then(function () {
            copiedCount++;
            $('#copiedLinks').text(copiedCount);
            btn.removeClass('btn-outline-secondary').addClass('btn-success')
               .html('<i class="bi bi-check-circle"></i>').prop('disabled', true);
            saveState();
        });
    });

    loadState();

});
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
