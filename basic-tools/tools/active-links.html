<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clickable Link Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    #result:empty::after {
      content: "Generated HTML will appear here.";
      color: #9aa1ac;
      font-style: italic;
    }
    #result { min-height: 48px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-light py-4 py-md-5">

<div class="container px-3" style="max-width: 800px;">
  <h1 class="mb-4 text-center h3">Clickable Link Generator</h1>

  <!-- Domain input -->
  <div class="mb-3">
    <label for="domainInput" class="form-label">Enter Your Domain (e.g. example.com):</label>
    <input type="text" id="domainInput" class="form-control" placeholder="example.com">
  </div>

  <div class="mb-3">
    <label for="htmlInput" class="form-label">Paste HTML or plain text with URLs:</label>
    <textarea id="htmlInput" class="form-control" rows="6"
      placeholder="Example: Visit https://example.com for more info"></textarea>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <button id="generateBtn" class="btn btn-primary flex-grow-1">Generate</button>
    <button id="resetBtn" class="btn btn-outline-danger">Reset</button>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Result (HTML code)</span>
      <button id="copyBtn" class="btn btn-sm btn-outline-secondary">Copy</button>
    </div>
    <pre id="result" class="card-body bg-white border rounded mb-0"></pre>
  </div>
</div>

<script>
$(function() {

  const STORAGE_KEY = 'tool_active-links_data';

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        domainInput: $('#domainInput').val(),
        htmlInput: $('#htmlInput').val(),
        result: $('#result').text()
      }));
    } catch (e) { console.error('Could not save data:', e); }
  }

  function loadState() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }
    catch (e) { saved = null; }
    if (!saved) return;
    if (typeof saved.domainInput === 'string') $('#domainInput').val(saved.domainInput);
    if (typeof saved.htmlInput === 'string') $('#htmlInput').val(saved.htmlInput);
    if (typeof saved.result === 'string') $('#result').text(saved.result);
  }

  $('#domainInput, #htmlInput').on('input', saveState);

  $('#resetBtn').on('click', function () {
    if (!confirm('Reset this tab\'s saved data? This cannot be undone.')) return;
    $('#domainInput').val('');
    $('#htmlInput').val('');
    $('#result').text('');
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  });

  // --- Auto-trim spaces for domain input ---
  $("#domainInput").on("input paste blur", function(e){
    if (e.type === "paste") {
      e.preventDefault();
      const pasteData = (e.originalEvent.clipboardData || window.clipboardData).getData("text");
      this.value = pasteData.trim();
    } else {
      this.value = this.value.trim();
    }
  });

  $("#generateBtn").on("click", function() {
    const input  = $("#htmlInput").val();
    const domain = $("#domainInput").val().trim();

    // 1️⃣ Convert bare URLs to clickable links, skipping existing anchors
    let converted = input.replace(
      /(?<!<a[^>]*?>)(https?:\/\/[^\s<]+)(?![^<]*?<\/a>)/g,
      '<a href="$1">$1</a>'    // no target/rel yet
    );

    // 2️⃣ For every <a> tag, decide if it's internal or external
    converted = converted.replace(/<a\b[^>]*href=["']([^"']+)["'][^>]*>/gi, function(match, href) {
      // If a domain is provided and the href contains it -> internal
      if (domain && href.indexOf(domain) !== -1) {
        // Remove any existing target/rel just in case
        return match
          .replace(/\s+target="_blank"/gi, "")
          .replace(/\s+rel="noopener"/gi, "");
      } else {
        // External: ensure target="_blank" rel="noopener" are present
        let newTag = match;

        // add target if missing
        if (!/\s+target="/i.test(newTag)) {
          newTag = newTag.replace(/^<a/i, '<a target="_blank"');
        }
        // add rel if missing
        if (!/\s+rel="/i.test(newTag)) {
          newTag = newTag.replace(/^<a/i, '<a rel="noopener"');
        }
        return newTag;
      }
    });

    $("#result").text(converted);
    saveState();
  });

  // --- Copy result ---
  $("#copyBtn").on("click", function() {
    const textToCopy = $("#result").text();
    navigator.clipboard.writeText(textToCopy)
      .then(() => {
        $(this)
          .text("Copied!")
          .addClass("btn-success")
          .removeClass("btn-outline-secondary");
        setTimeout(() => {
          $(this)
            .text("Copy")
            .removeClass("btn-success")
            .addClass("btn-outline-secondary");
        }, 1500);
      })
      .catch(err => alert("Copy failed: " + err));
  });

  loadState();
});
</script>


</body>
</html>
