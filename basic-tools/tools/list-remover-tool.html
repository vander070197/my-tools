<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Remover Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    textarea {
      height: 180px;
    }
  </style>
</head>
<body class="bg-light p-4">

<div class="container">
  <h3 class="mb-4 text-center fw-bold">List Remover Tool</h3>

  <div class="row g-4">

    <!-- Listed Base -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Listed Base (Items to Remove)</label>
      <textarea id="baseList" class="form-control" placeholder="Enter items, one per line..."></textarea>
    </div>

    <!-- Full List -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Full Listed</label>
      <textarea id="fullList" class="form-control" placeholder="Enter full list here..."></textarea>
    </div>

  </div>

  <!-- Buttons -->
  <div class="mt-4 d-flex gap-3">
    <button class="btn btn-primary" onclick="removeItems()">Remove Items</button>
    <button class="btn btn-success" onclick="copyResult()">Copy Result</button>
    <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
  </div>

  <!-- Result -->
  <div class="mt-4">
    <label class="form-label fw-semibold">Result</label>
    <textarea id="result" class="form-control" readonly></textarea>
  </div>
</div>


<script>
function removeItems() {
  const base = document.getElementById("baseList").value
    .split("\n")
    .map(i => i.trim())
    .filter(i => i !== "");

  const full = document.getElementById("fullList").value
    .split("\n")
    .map(i => i.trim())
    .filter(i => i !== "");

  // Remove base items from full list
  const filtered = full.filter(item => !base.includes(item));

  document.getElementById("result").value = filtered.join("\n");
}

function copyResult() {
  const result = document.getElementById("result");
  result.select();
  document.execCommand("copy");
}

function resetAll() {
  document.getElementById("baseList").value = "";
  document.getElementById("fullList").value = "";
  document.getElementById("result").value = "";
}
</script>

</body>
</html>
