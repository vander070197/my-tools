<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkbox Counter & Not Checked List</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="p-4">

<div class="container">
    <h4>PDQA Team List</h4>

    <div id="checkboxContainer" class="mb-3"></div>

    <button id="resetBtn" class="btn btn-danger mb-3">Reset</button>

    <p><strong>Checked Count:</strong> <span id="checkedCount">0</span></p>
    <p><strong>Dev Only:</strong> <span>11</span></p>
    <p><strong>Dev with leader:</strong> <span>13</span></p>

    <div class="alert alert-warning">
        <strong>Not Checked:</strong>
        <ul id="notCheckedList" class="mb-0"></ul>
    </div>
</div>

<script>
$(function(){

const items = [
    "Alda David Jake",
    "Allego Ma. Charisse",
    "Arenas Princess Eramie",
    "Babatuan Jakeson Rey",
    "Benitez Claudine",
    "Estenzo Kimberly",
    "Gedorio Angelo",
    "Omambac Angelica",
    "Pagador Richard",
    "Paragat Jay",
    "Quijano Vincent John",
    "Seroylas Debbie"
];

    // Generate checkboxes
    let html = '';
    items.forEach((item, index) => {
        html += `
        <div class="form-check">
            <input class="form-check-input task-checkbox" type="checkbox" id="cb${index}" data-name="${item}">
            <label class="form-check-label" for="cb${index}">${item}</label>
        </div>`;
    });

    $('#checkboxContainer').html(html);

    function updateStats() {
        let checked = $('.task-checkbox:checked').length;
        $('#checkedCount').text(checked);

        let notChecked = [];
        $('.task-checkbox').each(function(){
            if (!$(this).is(':checked')) {
                notChecked.push($(this).data('name'));
            }
        });

        let list = '';
        notChecked.forEach(name => {
            list += `<li>${name}</li>`;
        });

        $('#notCheckedList').html(list);
    }

    // Event listener
    $(document).on('change', '.task-checkbox', updateStats);

    // Reset button handler
    $('#resetBtn').on('click', function(){
        $('.task-checkbox').prop('checked', false);
        updateStats();
    });

    // initial update
    updateStats();
});
</script>

</body>
</html>
