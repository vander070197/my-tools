<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkbox Counter & Not Checked List</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
  body { background:#f4f6f9; }
  .tool-card { max-width: 720px; margin: 0 auto; }
  #checkboxContainer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 4px 12px;
  }
  #checkboxContainer .form-check { padding-top: 6px; padding-bottom: 6px; }
  .stat-box {
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
  }
  .stat-box .stat-num { font-size: 1.25rem; font-weight: 700; display: block; }
  .progress { height: 8px; }
</style>
</head>
<body class="p-3 p-md-4">

<div class="tool-card">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h4 class="mb-0">PDQA Team List</h4>
      <button id="resetBtn" class="btn btn-outline-danger btn-sm">Reset</button>
    </div>

    <div class="card p-3 mb-3 shadow-sm">
      <div id="checkboxContainer" class="mb-2"></div>
      <div class="progress mb-2" role="progressbar" aria-label="Attendance checked progress" aria-valuemin="0" aria-valuemax="12">
        <div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
      </div>
      <div class="form-text mb-0">Your checked attendance is saved automatically in this browser.</div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-4">
        <div class="stat-box">
          <span class="stat-num" id="checkedCount" aria-live="polite">0</span>
          <span class="text-muted small">Checked</span>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-box">
          <span class="stat-num">11</span>
          <span class="text-muted small">Dev Only</span>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-box">
          <span class="stat-num">13</span>
          <span class="text-muted small">Dev + Leader</span>
        </div>
      </div>
    </div>

    <div class="alert alert-warning mb-0">
        <strong>Not Checked:</strong>
        <ul id="notCheckedList" class="mb-0" aria-live="polite"></ul>
    </div>
</div>

<script>
$(function(){

const STORAGE_KEY = 'tool_dev-attendance-list_data';

const items = [
    "Alda David Jake",
    "Allego Ma. Charisse",
    "Arenas Princess Eramie",
    "Babatuan Jakeson Rey",
    "Benitez Claudine",
    "Estenzo Kimberly",
    "Gedorio Angelo",
    "Omambac Angelica",
    "Pagador Richard",
    "Paragat Jay",
    "Quijano Vincent John",
    "Seroylas Debbie"
];

    // Generate checkboxes
    let html = '';
    items.forEach((item, index) => {
        html += `
        <div class="form-check">
            <input class="form-check-input task-checkbox" type="checkbox" id="cb${index}" data-name="${item}">
            <label class="form-check-label" for="cb${index}">${item}</label>
        </div>`;
    });

    $('#checkboxContainer').html(html);

    function updateStats() {
        let total = $('.task-checkbox').length;
        let checked = $('.task-checkbox:checked').length;
        $('#checkedCount').text(checked);

        const pct = total ? Math.round((checked / total) * 100) : 0;
        $('#progressBar').css('width', pct + '%').attr('aria-valuenow', checked);

        let notChecked = [];
        $('.task-checkbox').each(function(){
            if (!$(this).is(':checked')) {
                notChecked.push($(this).data('name'));
            }
        });

        let list = '';
        if (notChecked.length === 0) {
            list = '<li class="list-unstyled text-success">Everyone is checked in 🎉</li>';
        } else {
            notChecked.forEach(name => {
                list += `<li>${name}</li>`;
            });
        }

        $('#notCheckedList').html(list);
    }

    // ---------- Persistence ----------
    function saveState() {
        const checkedNames = $('.task-checkbox:checked').map(function(){
            return $(this).data('name');
        }).get();
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ checkedNames }));
        } catch (e) { console.error('Could not save data:', e); }
    }

    function loadState() {
        let saved = null;
        try {
            saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        } catch (e) { saved = null; }

        if (saved && Array.isArray(saved.checkedNames)) {
            $('.task-checkbox').each(function(){
                if (saved.checkedNames.includes($(this).data('name'))) {
                    $(this).prop('checked', true);
                }
            });
        }
    }

    // Event listener
    $(document).on('change', '.task-checkbox', function(){
        updateStats();
        saveState();
    });

    // Reset button handler
    $('#resetBtn').on('click', function(){
        if (!confirm('Reset this tab\'s saved data? This cannot be undone.')) return;
        $('.task-checkbox').prop('checked', false);
        updateStats();
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    });

    // initial load + update
    loadState();
    updateStats();
});
</script>

</body>
</html>
