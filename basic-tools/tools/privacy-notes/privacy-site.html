<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Privacy Template</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    code {
      display: block;
      white-space: pre-wrap;
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .flex_input {display:flex; justify-content:space-between; gap:20px;}
    .flex_input .mb-3 {width:100%;}
    .for_previews { position: absolute; visibility: hidden; }
  </style>
</head>
<body class="container py-4">

  <h2 class="mb-3">Basic Template</h2>

  <!-- Input area -->
  <div class="mb-3">
    <label for="companyInput" class="form-label">Enter Company Name:</label>
    <input type="text" id="companyInput" class="form-control" placeholder="Type company name...">
  </div>

  <div class="flex_input">
    <div class="mb-3">
      <label for="emailInput" class="form-label">Enter Email Address(es):</label>
      <textarea id="emailInput" class="form-control" placeholder="Enter multiple emails, separated by commas or new lines"></textarea>
    </div>

    <div class="mb-3">
      <label for="phoneInput" class="form-label">Enter Phone Number(s):</label>
      <textarea id="phoneInput" class="form-control" placeholder="Enter multiple numbers, separated by commas or new lines"></textarea>
    </div>
  </div>

  <button class="btn btn-outline-danger" id="resetBtn">Reset</button>

  <!-- Live Preview -->
  <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
    <h5 class="mb-0">Live Preview</h5>
    <button class="btn btn-sm btn-outline-primary" id="copyPageBtn">Copy Preview</button>
  </div>
  <div class="card p-3 mb-4 page_title_con">
    <h2>Page Title</h2>
    <p class="page_title_con">
      <span class="comp_name">[Company Name]</span> - Do Not Sell or Share My Personal Information
    </p>
    <div class="for_previews"><strong>Emails:</strong> <span class="email_preview"></span></div>
    <div class="for_previews"><strong>Phones:</strong> <span class="phone_preview"></span></div>
  </div>

  <!-- Code Example -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">Generated Code</h5>
    <button class="btn btn-sm btn-outline-primary" id="copyCodeBtn">Copy Code</button>
  </div>
  <code id="outputCode"></code>

  <script>
    const companyInput = document.getElementById("companyInput");
    const emailInput = document.getElementById("emailInput");
    const phoneInput = document.getElementById("phoneInput");
    const outputCode = document.getElementById("outputCode");

    // ✅ Built-in Do Not Sell / Share template (no file upload needed)
    const originalTemplate = `<!-- wp:html -->
<p><span class="comp_name">[Company Name]</span> respects your privacy. We do not sell your personal information for money. Some limited information may be shared with service providers (such as analytics tools or advertising platforms), which may use it for analytics or cross-context behavioral advertising (for example, showing ads across different websites). California residents have the right to opt out of this sharing at any time.</p>
 
<p>California law (the California Consumer Privacy Act and California Privacy Rights Act) gives California residents the right to opt out of the sale or sharing of their personal information. This page explains those rights and how you can exercise them.</p>
 
<p><strong>Your Rights</strong></p>
<p>If you are a California resident, you have the right to:</p>
<ul class="bullet">
    <li>Know whether your personal information is being sold or shared.</li>
    <li>Opt out of the sale or sharing of your personal information at any time.</li>
    <li>Request confirmation regarding how your data is collected, used, and whether it is sold or shared</li>
</ul>
 
<p>We will not discriminate against you for exercising these rights.</p>
 
<p><strong>How We Use and Protect Information</strong></p>
<p>We may share your information only in these limited circumstances:</p>
<ul class="bullet">
    <li>Service providers who support our business operations under confidentiality and security obligations.</li>
    <li>Legal or regulatory requirements when required by law.</li>
    <li>Business transfers if we are involved in a merger, acquisition, or sale of assets.</li>
    <li>With your consent for any other specific purpose.</li>
</ul>
 
<p>We apply strict safeguards: credentials and files are stored only in approved systems, access is limited to authorized personnel, and access rights are removed when roles change.</p>
<p>Some analytics and advertising platforms may use activity data to deliver targeted advertising across websites. California residents can opt out of this sharing.</p>
 
<p><strong>How to Opt Out</strong></p>
<p>While we do not sell personal information for money, you may submit a request to opt out of the sharing of your information for analytics or advertising purposes, or to ensure your preferences are recorded. Contact us:</p>

<ul class="bullet">
    <li>By email: <a href="mailto:value_here" class="email_val">[Client's Email Address]</a></li>
    <li>By phone: <a href="tel:value_here" class="phone_val">[Client's Phone Number]</a></li>
</ul>
 
<p>Include your full name and the contact information you used with us (such as your email address).</p>
 
<p><strong>Updates</strong></p>
<p>If our practices change, we will update this page and provide notice before selling or sharing any personal information.</p>
<!-- /wp:html -->`;

    // ✅ Copy helper
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          alert("Copied to clipboard!");
        }).catch(err => {
          console.error("Clipboard error:", err);
        });
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        alert("Copied to clipboard!");
      }
    }

    // ✅ Copy buttons
    document.getElementById("copyPageBtn").addEventListener("click", () => {
      const textToCopy = document.querySelector(".page_title_con p").innerText.trim();
      copyToClipboard(textToCopy);
    });

    document.getElementById("copyCodeBtn").addEventListener("click", () => {
      const textToCopy = outputCode.innerText.trim();
      copyToClipboard(textToCopy);
    });

    // Common update function (Company, Emails, Phones) — runs live as inputs change
    function updateTemplate() {
      const company = companyInput.value.trim() || "[Company Name]";
      const emails = emailInput.value.split(/[\n,]+/).map(e => e.trim()).filter(e => e);
      const phones = phoneInput.value.split(/[\n,]+/).map(p => p.trim()).filter(p => p);

      // ✅ Wrap emails in <a>
      const emailLinks = emails.map(email => {
        return `<a class="email_val" href="${email.includes("@") ? `mailto:${email}` : "#"}">${email}</a>`;
      }).join(", ") || `<a class="email_val" href="#">[Client's Email Address]</a>`;

      // ✅ Wrap phones in <a>
      const phoneLinks = phones.map(phone => {
        const telValue = phone.replace(/\D/g, "");
        return `<a class="phone_val" href="${telValue ? `tel:${telValue}` : "#"}">${phone}</a>`;
      }).join(", ") || `<a class="phone_val" href="#">[Client's Phone Number]</a>`;

      // ✅ Update Preview
      document.querySelectorAll(".comp_name").forEach(span => span.textContent = company);
      document.querySelector(".email_preview").innerHTML = emailLinks;
      document.querySelector(".phone_preview").innerHTML = phoneLinks;

      // ✅ Update Code (replace placeholders with generated content)
      let updatedContent = originalTemplate
        .replace(/<span class="comp_name">.*?<\/span>/g, `<span class="comp_name">${company}</span>`)
        .replace(/<a[^>]*class="email_val"[^>]*>.*?<\/a>/g, emailLinks)
        .replace(/<a[^>]*class="phone_val"[^>]*>.*?<\/a>/g, phoneLinks);

      outputCode.textContent = updatedContent;
    }

    // Attach input listeners — real-time updates
    companyInput.addEventListener("input", updateTemplate);
    emailInput.addEventListener("input", updateTemplate);
    phoneInput.addEventListener("input", updateTemplate);

    // ✅ Only trim company input
    companyInput.addEventListener("input", function () {
      this.value = this.value.replace(/^\s+/, ""); // prevent leading space
    });
    companyInput.addEventListener("blur", function () {
      this.value = this.value.trim();
    });

    // Reset button logic
    document.getElementById("resetBtn").addEventListener("click", function () {
      companyInput.value = "";
      emailInput.value = "";
      phoneInput.value = "";
      updateTemplate();
    });

    // Initial render on page load
    updateTemplate();
  </script>
</body>
</html>
