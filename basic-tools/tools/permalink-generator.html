<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permalink Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background:#f8f9fa;
    }
    .result-box{
        background:#fff;
        border-radius:10px;
        padding:15px;
        margin-bottom:10px;
        box-shadow:0 2px 6px rgba(0,0,0,0.05);
    }
    .permalink{
        font-family:monospace;
        word-break:break-all;
    }
    #resultContainer:empty::before {
        content: "Generated permalinks will appear here.";
        color: #9aa1ac;
        font-style: italic;
        display: block;
        padding: 4px 2px;
    }
    @media (max-width: 576px) {
        .container.py-5 { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
        .result-box { flex-direction: column; align-items: flex-start !important; gap: 8px; }
        .result-box .btn { align-self: flex-end; }
    }
</style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 class="mb-3">Permalink Generator</h4>

                    <textarea id="titleInput" class="form-control mb-3" rows="6" placeholder="Enter titles (one per line)..."></textarea>

                    <div class="d-flex flex-wrap gap-2">
                        <button id="generateBtn" class="btn btn-primary flex-grow-1">
                            Generate Permalink
                        </button>
                        <button id="resetBtn" class="btn btn-outline-danger">
                            Reset
                        </button>
                    </div>

                </div>
            </div>

            <div id="resultContainer" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function(){

    const STORAGE_KEY = 'tool_permalink-generator_data';

    function saveState() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                titleInput: $("#titleInput").val(),
                resultHTML: $("#resultContainer").html()
            }));
        } catch (e) { console.error('Could not save data:', e); }
    }

    function loadState() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }
        catch (e) { saved = null; }
        if (!saved) return;
        if (typeof saved.titleInput === 'string') $("#titleInput").val(saved.titleInput);
        if (typeof saved.resultHTML === 'string') $("#resultContainer").html(saved.resultHTML);
    }

    $("#titleInput").on('input', saveState);

    $("#resetBtn").on('click', function(){
        if (!confirm('Reset this tab\'s saved data? This cannot be undone.')) return;
        $("#titleInput").val('');
        $("#resultContainer").html('');
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    });

    loadState();

    $("#generateBtn").click(function(){

        let input = $("#titleInput").val().trim();
        $("#resultContainer").html("");

        if(input === ""){
            alert("Please enter at least one title.");
            return;
        }

        let lines = input.split("\n");

        lines.forEach(function(title){

            if(title.trim() === "") return;

            let permalink = generateSlug(title);

            let resultHTML = `
                <div class="result-box d-flex justify-content-between align-items-center">
                    <div class="permalink">${permalink}</div>
                    <button class="btn btn-sm btn-success copyBtn">Copy</button>
                </div>
            `;

            $("#resultContainer").append(resultHTML);
        });

        saveState();
    });

    $(document).on("click", ".copyBtn", function(){
        let text = $(this).siblings(".permalink").text();
        navigator.clipboard.writeText(text);

        $(this).text("Copied!");
        let btn = $(this);
        setTimeout(function(){
            btn.text("Copy");
        }, 1500);
    });

});


// MAIN SLUG FUNCTION
function generateSlug(text){

    text = text.toLowerCase().trim();

    // Normalize all hyphen variations to standard dash
    text = text.replace(/[\u2010\u2011\u2012\u2013\u2014\u2015]/g, "-");

    // Replace special words
    text = myFunction(text, "&", "and");
    text = myFunction(text, "/", "-or-");

    // Remove special characters except space and dash
    text = text.replace(/[^a-z0-9\s-]/g, "");

    // Replace spaces with dash
    text = text.replace(/\s+/g, "-");

    // Remove multiple dashes
    text = text.replace(/-+/g, "-");

    // Trim dash from start & end
    text = text.replace(/^-+|-+$/g, "");

    return text;
}


// REUSABLE REPLACE FUNCTION
function myFunction(text, find, replace){
    return text.split(find).join(replace);
}

</script>

</body>
</html>
